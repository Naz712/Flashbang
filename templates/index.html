<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashbang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell">
  <!-- top app bar -->
  <div class="appbar">
    <div class="logo-row">
      <div class="logo-tile">F</div>
      <span class="logo-name">Flashbang</span>
    </div>
    <div class="tabs">
      <button id="tabStudy" class="tab on">Study</button>
      <button id="tabProgress" class="tab">Progress</button>
      <button id="tabCards" class="tab">Cards</button>
    </div>
    <div style="flex:1"></div>
    <div class="appbar-right">
      <button id="doNext" class="btn-ink" title="">Do next ↦</button>
      <span class="due-pill"><span class="due-dot"></span><span id="dueTotal">0</span>&nbsp;due</span>
    </div>
  </div>

  <!-- study screen -->
  <div id="studyScreen" class="study">
    <div class="chat">
      <div class="chat-head">
        <div class="chat-head-left">
          <span id="agentDot" class="agent-dot"></span>
          <span class="chat-title" id="agentName">Flashbang agent</span>
          <span class="chat-sub" id="sessionLabel"></span>
        </div>
        <span id="focusChip" class="focus-chip" style="display:none">
          <span class="pulse"></span>FOCUS · <span id="focusElapsedHead">0</span>M
        </span>
      </div>
      <div id="chatScroll" class="chat-scroll"></div>
      <div class="chat-foot">
        <div id="confRow" class="conf-row" style="display:none; margin-bottom:10px">
          <div class="conf-box">
            <span>Before answering — how confident are you?</span>
            <button class="conf-btn" data-conf="sure">Sure</button>
            <button class="conf-btn" data-conf="unsure">Unsure</button>
          </div>
        </div>
        <div id="cmdPalette" class="cmd-palette" style="display:none"></div>
        <div class="input-row">
          <input type="file" id="fileInput" accept=".pdf" multiple style="display:none">
          <button id="uploadBtn" class="attach-btn" title="Upload a PDF to ingest">📎</button>
          <input id="chatInput" placeholder="Ask a question, start a review, or paste notes…" autocomplete="off">
          <button id="sendBtn" class="send-key">⏎</button>
        </div>
      </div>
    </div>

    <div id="rail" class="rail"></div>
    <button id="railReopen" class="rail-reopen" title="Show panel" style="display:none">⇤</button>
  </div>

  <!-- progress screen -->
  <div id="progressScreen" class="progress-wrap" style="display:none">
    <div id="progressInner" class="progress"></div>
  </div>

  <!-- cards screen -->
  <div id="cardsScreen" class="progress-wrap" style="display:none">
    <div id="cardsInner" class="progress" style="max-width:940px"></div>
  </div>
</div>

<!-- topic page viewer -->
<div id="viewer" class="viewer-overlay" style="display:none">
  <div class="viewer-box">
    <div class="viewer-head">
      <div style="min-width:0">
        <div id="viewerTitle" style="font-size:13.5px; font-weight:700"></div>
        <div id="viewerSub" class="doc-meta"></div>
      </div>
      <button id="blackoutToggle" class="icon-btn" title="Blackout mode: drag to draw boxes over key facts; click a box to delete it">▮ Blackout</button>
      <button id="blackoutReveal" class="icon-btn" title="Reveal / re-hide every box">Reveal all</button>
      <button class="icon-btn" style="font-size:15px" onclick="closeViewer()">✕</button>
    </div>
    <div class="viewer-main">
      <div id="viewerBody" class="viewer-body"></div>
      <div id="viewerSide" class="viewer-side"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
