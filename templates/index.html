<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashbang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell">
  <!-- icon side nav -->
  <nav id="sideNav" class="sidenav">
    <div class="nav-top">
      <button id="navCollapse" class="nav-toggle" title="Collapse sidebar">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
      </button>
    </div>
    <div class="nav-items">
      <button id="tabProgress" class="nav-item" title="Home — all your analytics in one place">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        <span class="nav-label">Home</span>
      </button>
      <button id="tabStudy" class="nav-item on" title="Review — type answers, get graded, gaps reported">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="nav-label">Review</span>
      </button>
      <button id="tabReading" class="nav-item" title="Reading — pick a course, document, topic and read">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <span class="nav-label">Reading</span>
      </button>
      <button id="tabCards" class="nav-item" title="Cards — browse and edit">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="14" height="12" rx="2"/><path d="M7 21h12a2 2 0 0 0 2-2V9"/></svg>
        <span class="nav-label">Cards</span>
      </button>
    </div>
    <div style="flex:1"></div>
    <button id="doNext" class="nav-item nav-do" title="">
      <span style="font-size:14px; line-height:1">⚡</span>
      <span class="nav-label">Do next</span>
      <span class="nav-badge" title="Cards due"><span id="dueTotal">0</span></span>
    </button>
  </nav>

  <main class="main">
  <!-- study screen -->
  <div id="studyScreen" class="study">
    <div class="chat">
      <div class="chat-head">
        <div class="chat-head-left">
          <span id="agentDot" class="agent-dot"></span>
          <span class="chat-title" id="agentName">Review</span>
          <span class="chat-sub" id="sessionLabel"></span>
        </div>
        <span id="focusChip" class="focus-chip" style="display:none">
          <span class="pulse"></span>FOCUS · <span id="focusElapsedHead">0</span>M
        </span>
      </div>
      <div id="chatScroll" class="chat-scroll"></div>
      <div class="chat-foot">
        <div id="confRow" class="conf-row" style="display:none; margin-bottom:10px">
          <div class="conf-box">
            <span>Before answering — how confident are you?</span>
            <button class="conf-btn" data-conf="sure">Sure</button>
            <button class="conf-btn" data-conf="unsure">Unsure</button>
          </div>
        </div>
        <div id="sessionBar" style="display:none; gap:8px; margin-bottom:10px">
          <button class="conf-btn" onclick="skipCard()" title="Move on without grading — the card stays due">Skip card</button>
          <button class="conf-btn" onclick="endSession()" title="End now and get the gap report">End session</button>
        </div>
        <div class="input-row">
          <input id="chatInput" placeholder="Start a review to begin — cards get dealt here." autocomplete="off">
          <button id="sendBtn" class="send-key">⏎</button>
        </div>
      </div>
    </div>

  </div>

  <!-- reading hub -->
  <div id="readingScreen" class="progress-wrap" style="display:none">
    <div id="readingInner" class="progress"></div>
  </div>

  <!-- progress screen -->
  <div id="progressScreen" class="progress-wrap" style="display:none">
    <div id="progressInner" class="progress"></div>
  </div>

  <!-- cards screen -->
  <div id="cardsScreen" class="progress-wrap" style="display:none">
    <div id="cardsInner" class="progress" style="max-width:940px"></div>
  </div>
  </main>
</div>

<!-- focus timer — fixed top right, visible on every screen -->
<div id="focusFloat" class="focus-float"></div>
<input type="file" id="fileInput" accept=".pdf" multiple style="display:none">

<!-- topic page viewer -->
<div id="viewer" class="viewer-overlay" style="display:none">
  <div class="viewer-box">
    <div class="viewer-head">
      <div style="min-width:0">
        <div id="viewerTitle" style="font-size:13.5px; font-weight:700"></div>
        <div id="viewerSub" class="doc-meta"></div>
      </div>
      <button id="readerPrev" class="icon-btn reader-nav" title="Previous page (←)">‹</button>
      <button id="readerNext" class="icon-btn reader-nav" title="Next page (→ or space)">›</button>
      <button id="annToggle" class="icon-btn" title="Note mode: drag a box over an area and attach a comment">✎ Note</button>
      <button id="blackoutToggle" class="icon-btn" title="Blackout mode: drag to draw boxes over key facts; click a box to delete it">▮ Blackout</button>
      <button id="blackoutReveal" class="icon-btn" title="Reveal / re-hide every box">Reveal all</button>
      <button class="icon-btn" style="font-size:15px" onclick="closeViewer()">✕</button>
    </div>
    <div class="viewer-main">
      <div id="viewerBody" class="viewer-body"></div>
      <div id="viewerSide" class="viewer-side"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
