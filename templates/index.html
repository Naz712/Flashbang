<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashbang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell">
  <!-- icon side nav -->
  <nav id="sideNav" class="fb-nav">
    <div class="fb-nav-top">
      <button id="navCollapse" class="fb-nav-toggle" title="Collapse sidebar">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
      </button>
    </div>
    <div class="fb-nav-items">
      <button id="tabHome" class="fb-nav-item fb-nav-item--on" title="Home — your courses">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        <span class="fb-nav-label">Home</span>
      </button>
      <button id="tabStudy" class="fb-nav-item" title="Review — type answers, get graded, gaps reported">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="fb-nav-label">Review</span>
        <span class="fb-nav-badge" id="navDue" title="Cards due">0</span>
      </button>
      <button id="tabProgress" class="fb-nav-item" title="Analytics — how the studying is going">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span class="fb-nav-label">Analytics</span>
      </button>
      <button id="tabCards" class="fb-nav-item" title="Cards — browse and edit">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="14" height="12" rx="2"/><path d="M7 21h12a2 2 0 0 0 2-2V9"/></svg>
        <span class="fb-nav-label">Cards</span>
      </button>
    </div>
    <div style="flex:1"></div>
    <button id="doNext" class="fb-nav-item" title="">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
      <span class="fb-nav-label">Do next</span>
      <span class="fb-nav-badge" title="Cards due"><span id="dueTotal">0</span></span>
    </button>
  </nav>

  <main class="main">
  <!-- review screen: deck picker when idle, chat when a session is live -->
  <div id="studyScreen" class="study">
    <div id="reviewHome" class="fb-review-home"></div>
    <div class="fb-chat" id="chatPane" style="display:none">
      <div class="fb-chat-head">
        <div style="display:flex; align-items:center; gap:12px; min-width:0">
          <button class="fb-icon-btn" id="backToDecks" title="Back to your decks">‹ Decks</button>
          <span class="fb-chat-title" id="agentName">Review</span>
          <span class="fb-chat-sub" id="sessionLabel"></span>
        </div>
        <div id="sessionBar" style="display:none; gap:8px">
          <button class="fb-btn fb-btn--ghost" style="padding:6px 12px; font-size:11.5px"
            onclick="skipCard()" title="Move on without grading — the card stays due">Skip card</button>
          <button class="fb-btn fb-btn--ghost" style="padding:6px 12px; font-size:11.5px"
            onclick="endSession()" title="End now and get the gap report">End session</button>
        </div>
      </div>
      <div id="chatScroll" class="fb-chat-scroll"></div>
      <div class="fb-chat-foot">
        <div id="confRow" class="fb-conf-row" style="display:none; margin-bottom:10px">
          <div class="fb-conf-box">
            <span class="fb-body-sm">Before answering — how confident are you?</span>
            <button class="conf-btn" data-conf="sure">Sure</button>
            <button class="conf-btn" data-conf="unsure">Unsure</button>
          </div>
        </div>
        <div class="fb-input-row">
          <input id="chatInput" placeholder="Start a review to begin — cards get dealt here." autocomplete="off">
          <button id="sendBtn" class="fb-send">⏎</button>
        </div>
      </div>
    </div>

  </div>

  <!-- home: course canvas -->
  <div id="homeScreen" class="fb-screen" style="display:none">
    <div id="homeInner" class="fb-col"></div>
  </div>

  <!-- one course: the metrics band across the top, documents below -->
  <div id="courseScreen" class="fb-screen" style="display:none">
    <div id="courseInner" class="fb-col"></div>
  </div>

  <!-- analytics -->
  <div id="progressScreen" class="progress-wrap" style="display:none">
    <div id="progressInner" class="progress"></div>
  </div>

  <!-- cards screen -->
  <div id="cardsScreen" class="progress-wrap" style="display:none">
    <div id="cardsInner" class="progress" style="max-width:940px"></div>
  </div>
  </main>
</div>

<!-- assistant bubble — bottom right, opens a small command panel -->
<div id="asstPanel" class="fb-asst-panel" style="display:none">
  <div class="asst-head">
    <span class="fb-label">Assistant</span>
    <span style="flex:1"></span>
    <span class="asst-hint">library · notes · stats · planning</span>
    <button class="fb-icon-btn" onclick="toggleAsst()" title="Close">✕</button>
  </div>
  <div id="asstScroll" class="asst-scroll"></div>
  <div class="asst-foot">
    <div id="asstSuggest" class="asst-suggest" style="display:none"></div>
    <input id="asstInput" placeholder="Ask about your notes, or tell me to fix something…" autocomplete="off">
    <button id="asstSend" class="fb-send">⏎</button>
  </div>
</div>
<button id="asstBubble" class="fb-asst-bubble" title="Assistant — ask about your notes, edit the library, get stats">✦</button>
<input type="file" id="fileInput" accept=".pdf" multiple style="display:none">

<!-- topic page viewer -->
<div id="viewer" class="viewer-overlay" style="display:none">
  <div class="viewer-box">
    <div class="viewer-head">
      <div style="min-width:0">
        <div id="viewerTitle" style="font-size:13.5px; font-weight:700"></div>
        <div id="viewerSub" class="doc-meta"></div>
      </div>
      <button id="readerPrev" class="icon-btn reader-nav" title="Previous page (←)">‹</button>
      <button id="readerNext" class="icon-btn reader-nav" title="Next page (→ or space)">›</button>
      <button id="annToggle" class="icon-btn" title="Note mode: drag a box over an area and attach a comment">✎ Note</button>
      <button id="blackoutToggle" class="icon-btn" title="Blackout mode: drag to draw boxes over key facts; click a box to delete it">▮ Blackout</button>
      <button id="blackoutReveal" class="icon-btn" title="Reveal / re-hide every box">Reveal all</button>
      <button class="icon-btn" style="font-size:15px" onclick="closeViewer()">✕</button>
    </div>
    <div class="viewer-main">
      <div id="viewerBody" class="viewer-body"></div>
      <div id="viewerSide" class="viewer-side"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
